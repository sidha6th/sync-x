name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check but do not publish
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tag matches pubspec and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: tool/check_version.sh "${GITHUB_REF_NAME#v}"

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Coverage gate
        run: tool/check_coverage.sh
        env:
          COVERAGE_MIN: 100

      - name: Publish dry run
        run: flutter pub publish --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: flutter pub publish --force
